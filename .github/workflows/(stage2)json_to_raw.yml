name: (stage2)json-to-raw

# Stage 2 and nothing else: take one JSON file and write it into its raw table
# (src/transformations/stage_2/json_to_raw.py).
#
# ONE WORKFLOW FOR EVERY FEED, unlike stages 3-5. Those split per feed because
# each feed runs different transformations; stage 2 runs the same code for all
# four -- the per-feed differences live in stage_2/firm.py, interruptible.py,
# awards.py and ioc.py, and the columns come from the database.
#
# There is no feed to choose: the FILE NAME says which one it is. firms_*.json
# goes to gtran_firm, interruptibles_*.json to gtran_it, awards_*.json to gawd,
# ioc_*.json to gindex -- which is exactly how stage 1 names what it fetches.
# Point `file` at whichever JSON to load and that is the whole input.
#
# A file whose name doesn't say, or names two feeds, is refused rather than
# guessed at. Rename it after its feed.
#
# The default is the committed firm sample, so a plain "Run workflow" does
# something useful with no arguments. Point it at stage 1's output
# (data/_fetched_firms.json) to load a freshly fetched feed instead.
#
# Re-running a file loads it again: Bronze keeps every batch, duplicates
# included. Stage 3's deduplication(p1) is where duplicate content is dropped,
# so staging and Silver stay clean either way.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Path to the JSON file (repo-relative)"
        required: true
        default: "src/transformations/stage_1_2(ingestion)/data/firm_sample_worklow.json"
      dry_run:
        description: "Convert and report without writing anything"
        required: false
        default: false
        type: boolean

  # Callable from an orchestrator, so a feed's chain can run stage 2 without a
  # second copy of this definition.
  workflow_call:
    inputs:
      file:
        required: false
        type: string
        default: "src/transformations/stage_1_2(ingestion)/data/firm_sample_worklow.json"
      dry_run:
        required: false
        type: boolean
        default: false

# One stage 2 load at a time, so a run never collides with itself mid-write.
concurrency:
  group: stage2
  cancel-in-progress: false

jobs:
  load:
    name: json -> raw table
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}   # Neon connection string
      SOURCE_SYSTEM: NatGasHub
      TRIGGERED_BY: github-actions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The root requirements already carry the driver (psycopg2-binary) and
      # python-dotenv, which is all stage 2 needs.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fails fast if the secret was never set, instead of falling through to a
      # confusing "connection to server at localhost refused".
      - name: Check DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set for this repository."
            exit 1
          fi

      - name: Check the input file exists
        run: |
          if [ ! -f "${{ inputs.file }}" ]; then
            echo "::error::input file not found: ${{ inputs.file }}"
            exit 1
          fi
          echo "loading $(wc -c < "${{ inputs.file }}") bytes from ${{ inputs.file }}"

      # Built as an array because the sample path contains parentheses, and
      # because "[ cond ] && ARGS+=..." would exit non-zero on a false
      # condition and fail the step under bash -e.
      - name: Write JSON to its raw table
        run: |
          ARGS=(--file "${{ inputs.file }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python "src/transformations/stage_2/json_to_raw.py" "${ARGS[@]}"
