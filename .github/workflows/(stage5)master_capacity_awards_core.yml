name: (stage5)master-capacity [awards core]

# Master capacity - AWARDS / CORE.
#
# Assembles the core master capacity table for the AWARDS feed.
#
# ONE TABLE PER FILE: this workflow builds awards_core_master_capacity and nothing
# else, so it runs, logs and fails independently of the
# other 17. It targets a single folder, so whatever is registered there is what
# runs -- no transformation names are hardcoded here.
#
#     src/transformations/stage_5/master_capacity/awards/core/
#
# MANUAL ONLY: no cron schedule. Nothing enforces ordering. Run after stage 4 for this
# feed, and before (stage5)master_capacity_final_core.yml.
on:
  # Callable from the per-feed <feed>(stage...).yml orchestrator. Inputs are
  # optional; unset, the steps fall back to 'all' as on a manual dispatch.
  workflow_call:
    inputs:
      transformation:
        description: "'all', or one transformation name"
        required: false
        type: string
        default: "all"

  workflow_dispatch:
    inputs:
      transformation:
        description: "'all' for this folder, or one transformation name"
        required: true
        default: "all"

concurrency:
  group: stage5-awards-core
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRONZE_SCHEMA: bronze
      SILVER_SCHEMA: silver
      DECOMP_SCHEMA: silver_staging
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set for this repository."
            exit 1
          fi

      - name: What will run
        run: python run.py --list-groups

      - name: Inspect (before)
        run: python run.py --inspect

      - name: Run master capacity (awards core)
        run: |
          INPUT="${{ github.event.inputs.transformation || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            python run.py --group master_capacity/awards/core --reload
          else
            python run.py --table "$INPUT" --reload
          fi

      - name: Inspect (after)
        if: always()
        run: python run.py --inspect

