name: (stage4)rec-del-pairing [firm]

# Pairs receipts to deliveries for the FIRM feed, from that feed's
# locations table produced by the decomposition phase.
#
# PAIRING COVERS FIRM, INTERRUPTIBLE AND AWARDS. IOC has no stage 4.
#
# ONE FEED PER FILE: this workflow handles the FIRM feed and nothing else, so it
# runs, logs and fails completely independently of the other
# feeds. Its sibling files cover the rest.
#
# MANUAL ONLY: no cron schedule. Nothing enforces stage ordering, so run the
# stages in order by hand. Upstream of this one: (stage3)bronze_to_silver_firm.yml
on:
  # Callable from the firm(stage3_4_5).yml orchestrator. Inputs are optional;
  # unset, the steps fall back to 'all' exactly as on a manual dispatch.
  workflow_call:
    inputs:
      transformation:
        description: "'all', or one transformation name"
        required: false
        type: string
        default: "all"

  workflow_dispatch:
    inputs:
      transformation:
        description: "'all' for the whole feed, or one transformation name (ignores the feed filter)"
        required: true
        default: "all"

# Scoped to this stage AND feed, so the feeds never block each other but a run
# never collides with itself mid-transaction.
concurrency:
  group: stage4-firm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRONZE_SCHEMA: bronze
      SILVER_SCHEMA: silver
      # Where the decomposition phase lands its output; this stage reads it.
      DECOMP_SCHEMA: silver_staging
      # Stage numbering follows the workflows; the feed subdirectory below it
      # comes from the transformations' own `source` attribute.
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fails fast if the secret was never set, instead of falling through to
      # config.py's localhost default and dying with a confusing connect error.
      - name: Check DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set for this repository."
            exit 1
          fi

      - name: What will run for firm
        run: python run.py --list --source firm

      - name: Inspect (before)
        run: python run.py --inspect

      - name: Run rec-del-pairing (firm)
        run: |
          INPUT="${{ github.event.inputs.transformation || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            python run.py --group rec_del_pairing/firm --reload
          else
            python run.py --table "$INPUT" --reload
          fi

      - name: Inspect (after)
        if: always()
        run: python run.py --inspect

