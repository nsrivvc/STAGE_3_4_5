name: bronze-ingest-interruptibles

# STAGE 1 + STAGE 2 for the INTERRUPTIBLE TRANSPORT CONTRACTS feed.
#
# Flow: start the stage 1 mock NatGasHub API (src/transformations/stage_1),
# fetch /api/interruptibles from it to a JSON file, then hand that file to
# stage 2 (src/transformations/stage_2/json_to_raw.py), which creates the
# Bronze tables if they don't exist and loads bronze.gtran_it on Neon.
#
# Runs three ways:
#   * on its own via "Run workflow" (workflow_dispatch),
#   * as one of the four parallel jobs of bronze_ingest.yml (workflow_call), or
#   * as the first job of the interruptible(stage3_4_5).yml orchestrator.
#
# To point at the real NatGasHub API later: drop the "Start mock" step and
# fetch the live endpoint instead (with the API key secret). Stage 2 only ever
# sees the fetched JSON file, so nothing else changes.
on:
  workflow_dispatch:
  workflow_call:

env:
  API_BASE: "http://127.0.0.1:8000"
  FETCHED_FILE: "src/transformations/stage_1/data/_fetched_interruptibles.json"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Root requirements carry stage 2's driver (psycopg2-binary); stage 1's
      # requirements carry fastapi + uvicorn for the mock API.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r src/transformations/stage_1/requirements.txt

      # The src.mock_api.app module path resolves against the working
      # directory, hence the explicit working-directory on this step.
      - name: Start mock NatGasHub API (stage 1)
        working-directory: src/transformations/stage_1
        run: |
          nohup uvicorn src.mock_api.app:app --host 127.0.0.1 --port 8000 > mock_api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$API_BASE/health" > /dev/null && exit 0
            sleep 1
          done
          echo "mock API failed to start"; cat mock_api.log; exit 1

      - name: Fetch interruptibles JSON from the API
        run: curl -sf "$API_BASE/api/interruptibles" -o "$FETCHED_FILE"

      - name: Load into Bronze (stage 2)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # Neon connection string
          SOURCE_SYSTEM: NatGasHub
          TRIGGERED_BY: github-actions
        run: python "src/transformations/stage_2/json_to_raw.py" --file "$FETCHED_FILE" --create-tables
