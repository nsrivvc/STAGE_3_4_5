name: interruptible (stage 3-4-5)

# End-to-end run for the INTERRUPTIBLE feed: stage 3, then 4, then 5, then the three
# cross-feed FINAL tables.
#
# This is an orchestrator, not a copy. Each job calls the real per-stage
# workflow file as a reusable workflow, so there is exactly one definition of
# what each stage does. Editing a stage's own .yml changes it here too.
#
#
# ABOUT THE FINAL TABLES
# ----------------------
# The FINAL tables always run at the end of this chain. They consolidate
# whatever feeds currently sit in Silver: after an interruptible-only run they
# contain interruptible's fresh rows plus whatever the other feeds last left
# behind, and once other feeds have landed they fold into the same master tables.
#
# The ingestion code lives in this repo's src/transformations/stage_1_2(ingestion)/ subproject, so the whole
# pipeline (stage 1-2 ingest first, then 3-4-5) chains as plain jobs. The
# repository_dispatch trigger is kept for backwards compatibility with
# anything that still posts bronze-interruptible-loaded from outside; a
# dispatch-triggered run also re-ingests first, which is idempotent.
on:
  workflow_dispatch:
  # Called by shipper_scope_apply.yml when the dashboard changes which
  # shippers are attached, so a scope change replays this same chain
  # rather than a second copy of it.
  workflow_call:
  repository_dispatch:
    types: [bronze-interruptible-loaded]

concurrency:
  group: interruptible-end-to-end
  cancel-in-progress: false

jobs:
  ingest:
    name: stage 1-2 - ingest to bronze
    uses: "./.github/workflows/bronze_ingest_interruptibles.yml"
    secrets: inherit

  stage3:
    name: stage 3 - bronze to silver
    needs: ingest
    uses: "./.github/workflows/(stage3)bronze_to_silver_interruptible.yml"
    secrets: inherit

  stage4:
    name: stage 4 - rec-del pairing
    needs: stage3
    uses: "./.github/workflows/(stage4)rec_del_pairing_interruptible.yml"
    secrets: inherit

  stage5_core:
    name: stage 5 - interruptible core
    needs: stage4
    uses: "./.github/workflows/(stage5)master_capacity_interruptible_core.yml"
    secrets: inherit

  stage5_locations:
    name: stage 5 - interruptible locations
    needs: stage4
    uses: "./.github/workflows/(stage5)master_capacity_interruptible_locations.yml"
    secrets: inherit

  stage5_rates:
    name: stage 5 - interruptible rates
    needs: stage4
    uses: "./.github/workflows/(stage5)master_capacity_interruptible_rates.yml"
    secrets: inherit

  # The FINAL tables are cross-feed, so they wait for all three stage-5 jobs.
  # `!cancelled()` rather than success() so one failing grain still lets the
  # others consolidate, matching the standalone FINAL workflows.

  final_core:
    name: final - core
    needs: [stage5_core, stage5_locations, stage5_rates]
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/(stage5)master_capacity_final_core.yml"
    secrets: inherit

  final_locations:
    name: final - locations
    needs: [stage5_core, stage5_locations, stage5_rates]
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/(stage5)master_capacity_final_locations.yml"
    secrets: inherit

  final_rates:
    name: final - rates
    needs: [stage5_core, stage5_locations, stage5_rates]
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/(stage5)master_capacity_final_rates.yml"
    secrets: inherit
