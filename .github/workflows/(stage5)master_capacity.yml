name: (stage5)master-capacity

# Assembles the unified master capacity model from the per-type Silver tables.
#
# Runs everything registered in src/transformations/stage_4/master_capacity/ via
# `run.py --group`, so new modules dropped into that folder are picked up with
# no change to this file. The selector matches on any folder segment, so it keeps
# working if the component is moved between stages.
#
# NOTHING IS REGISTERED THERE YET: the folder is scaffolded but holds no
# transformations, so `--group master_capacity` logs a warning and exits 0. This
# workflow is therefore safe to enable now and starts doing real work the moment
# the first module lands.
#
# MANUAL ONLY: no cron schedule. Run it from the Actions tab when its upstream
# stages have finished.
#
# Upstream is (stage4)rec_del_pairing.yml. Nothing enforces that ordering now
# that the schedules are gone, so run the stages in order by hand. To automate
# it later, add a `workflow_run` trigger keyed on rec-del-pairing completing
# rather than reintroducing cron offsets.
on:
  workflow_dispatch:
    inputs:
      transformation:
        description: "'all' for the whole master capacity stage, or one transformation name"
        required: true
        default: "all"

concurrency:
  group: master-capacity
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRONZE_SCHEMA: bronze
      SILVER_SCHEMA: silver
      # Carried through in case a master capacity transformation reads the
      # decomposition output directly rather than only the paired tables.
      DECOMP_SCHEMA: silver_staging
      # Stage numbering follows the workflows, so each one produces a single
      # stage directory under parquet_output/.
      PARQUET_STAGE: stage5
      PARQUET_OUTPUT_DIR: parquet_output
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set for this repository."
            exit 1
          fi

      - name: Inspect (before)
        run: python run.py --inspect

      - name: Run master capacity
        run: |
          INPUT="${{ github.event.inputs.transformation || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            python run.py --group master_capacity
          else
            python run.py --table "$INPUT"
          fi

      - name: Inspect (after)
        if: always()
        run: python run.py --inspect

      # Runners are ephemeral, so the export has to leave the machine. `always()`
      # keeps a partial export when a DB write failed, which is when it helps most.
      - name: Upload Parquet export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silver-parquet-stage5-${{ github.run_id }}
          path: parquet_output/
          if-no-files-found: warn
