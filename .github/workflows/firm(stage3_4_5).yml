name: firm (stage 3-4-5)

# End-to-end run for the FIRM feed: stage 1-2 ingestion, then stage 3, 4, 5,
# then the three cross-feed FINAL tables.
#
# This is an orchestrator, not a copy. Each job calls the real per-stage
# workflow file as a reusable workflow, so there is exactly one definition of
# what each stage does. Editing a stage's own .yml changes it here too.
#
#   ingest (stage 1-2)  ->  stage3  ->  stage4  ->  stage5 core ------\
#                                                   stage5 locations   >-- finals
#                                                   stage5 rates -----/
#
# The ingestion code lives in this repo's src/transformations/stage_1_2(ingestion)/ subproject, so the whole
# pipeline chains as plain jobs. The repository_dispatch trigger below is kept
# for backwards compatibility with anything that still posts
# bronze-firm-loaded from outside; a dispatch-triggered run also re-ingests
# first, which is idempotent.
#
# ABOUT THE FINAL TABLES
# ----------------------
# The FINAL tables always run at the end of this chain. They consolidate
# whatever feeds currently sit in Silver: after a firm-only run they contain
# firm's fresh rows plus whatever the other feeds last left behind, and once
# other feeds have landed they fold into the same master tables.
on:
  workflow_dispatch:
  # Called by shipper_scope_apply.yml when the dashboard changes which
  # shippers are attached, and by all_sources(stage1-5).yml when more than one
  # feed runs together -- so a scope change or a multi-feed run replays this
  # same chain rather than a second copy of it.
  workflow_call:
    inputs:
      run_finals:
        description: >-
          "false" to skip the three cross-feed FINAL tables at the end of this
          chain. The finals consolidate whatever feeds exist, so they only ever
          need to run ONCE. When several feeds run at the same time each one
          calling them would collide on the stage5-final-* concurrency groups
          -- one call runs, one queues, and any third evicts the queued one,
          failing that feed's whole run. all_sources(stage1-5).yml therefore
          passes "false" here and runs the finals itself, once, at the end.
          Left unset (a direct dispatch, or a repository_dispatch) the finals
          run as before.
        required: false
        type: string
        default: "true"
  repository_dispatch:
    types: [bronze-firm-loaded]

# One end-to-end firm run at a time. The called workflows keep their own
# concurrency groups, which still apply per stage.
concurrency:
  group: firm-end-to-end
  cancel-in-progress: false

jobs:
  ingest:
    name: stage 1-2 - ingest to bronze
    uses: "./.github/workflows/bronze_ingest_firm.yml"
    secrets: inherit

  stage3:
    name: stage 3 - bronze to silver
    needs: ingest
    uses: "./.github/workflows/(stage3)bronze_to_silver_firm.yml"
    secrets: inherit

  stage4:
    name: stage 4 - rec-del pairing
    needs: stage3
    uses: "./.github/workflows/(stage4)rec_del_pairing_firm.yml"
    secrets: inherit

  stage5_core:
    name: stage 5 - firm core
    needs: stage4
    uses: "./.github/workflows/(stage5)master_capacity_firm_core.yml"
    secrets: inherit

  stage5_locations:
    name: stage 5 - firm locations
    needs: stage4
    uses: "./.github/workflows/(stage5)master_capacity_firm_locations.yml"
    secrets: inherit

  stage5_rates:
    name: stage 5 - firm rates
    needs: stage4
    uses: "./.github/workflows/(stage5)master_capacity_firm_rates.yml"
    secrets: inherit

  # The FINAL tables are cross-feed, so they wait for all three stage-5 jobs.
  # `!cancelled()` rather than success() so one failing grain still lets the
  # others consolidate, matching the standalone FINAL workflows.
  final_core:
    name: final - core
    needs: [stage5_core, stage5_locations, stage5_rates]
    if: ${{ !cancelled() && inputs.run_finals != 'false' }}
    uses: "./.github/workflows/(stage5)master_capacity_final_core.yml"
    secrets: inherit

  final_locations:
    name: final - locations
    needs: [stage5_core, stage5_locations, stage5_rates]
    if: ${{ !cancelled() && inputs.run_finals != 'false' }}
    uses: "./.github/workflows/(stage5)master_capacity_final_locations.yml"
    secrets: inherit

  final_rates:
    name: final - rates
    needs: [stage5_core, stage5_locations, stage5_rates]
    if: ${{ !cancelled() && inputs.run_finals != 'false' }}
    uses: "./.github/workflows/(stage5)master_capacity_final_rates.yml"
    secrets: inherit
