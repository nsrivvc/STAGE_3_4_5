name: firm (stage 3-4-5)

# End-to-end run for the FIRM feed: stage 3, then 4, then 5, then the three
# cross-feed FINAL tables.
#
# This is an orchestrator, not a copy. Each job calls the real per-stage
# workflow file as a reusable workflow, so there is exactly one definition of
# what each stage does. Editing a stage's own .yml changes it here too.
#
#   stage3  ->  stage4  ->  stage5 core ------\
#                           stage5 locations   >-- final core / locations / rates
#                           stage5 rates -----/
#
# TRIGGERED FROM THE INGESTION REPO
# ---------------------------------
# nsrivvc/json--bronze--postgres fires a repository_dispatch at the end of
# bronze_ingest_firm.yml, once that run has loaded Bronze on Neon. `workflow_run`
# cannot be used: it only observes workflows in the same repository.
#
# The ingestion side needs a token with `contents: write` on THIS repo, since a
# job's default GITHUB_TOKEN is scoped to its own repository and cannot dispatch
# across repos. See the README section "Triggering from the ingestion repo".
#
# READ THIS BEFORE TRUSTING THE FINAL TABLES
# ------------------------------------------
# The FINAL tables consolidate EVERY feed, not just firm. Running them from a
# firm-only chain rebuilds them from firm's fresh rows plus whatever the other
# feeds last left behind. That is why an ingestion-triggered run defaults to
# NOT rebuilding them: a firm ingest says nothing about the other feeds. Send
# client_payload.run_final = true to override, or run the FINAL workflows
# separately once every feed has landed.
on:
  workflow_dispatch:
    inputs:
      run_final:
        description: "Also rebuild the cross-feed FINAL tables (see note above)"
        required: true
        type: boolean
        default: true
  repository_dispatch:
    types: [bronze-firm-loaded]

# One end-to-end firm run at a time. The called workflows keep their own
# concurrency groups, which still apply per stage.
concurrency:
  group: firm-end-to-end
  cancel-in-progress: false

jobs:
  # Resolves run_final across both triggers: a manual dispatch has `inputs`, a
  # repository_dispatch does not, and reading a missing input yields empty --
  # which would silently skip the finals with no explanation.
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_final: ${{ steps.pick.outputs.run_final }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VALUE="${{ inputs.run_final }}"
          else
            # Ingestion-triggered: default OFF, since one feed landing says
            # nothing about the freshness of the other four.
            VALUE="${{ github.event.client_payload.run_final || false }}"
          fi
          echo "run_final=$VALUE" >> "$GITHUB_OUTPUT"
          echo "trigger=${{ github.event_name }}  run_final=$VALUE"

  stage3:
    name: stage 3 - bronze to silver
    uses: "./.github/workflows/(stage3)bronze_to_silver_firm.yml"
    secrets: inherit

  stage4:
    name: stage 4 - rec-del pairing
    needs: stage3
    uses: "./.github/workflows/(stage4)rec_del_pairing_firm.yml"
    secrets: inherit

  stage5_core:
    name: stage 5 - firm core
    needs: stage4
    uses: "./.github/workflows/(stage5)master_capacity_firm_core.yml"
    secrets: inherit

  stage5_locations:
    name: stage 5 - firm locations
    needs: stage4
    uses: "./.github/workflows/(stage5)master_capacity_firm_locations.yml"
    secrets: inherit

  stage5_rates:
    name: stage 5 - firm rates
    needs: stage4
    uses: "./.github/workflows/(stage5)master_capacity_firm_rates.yml"
    secrets: inherit

  # The FINAL tables are cross-feed, so they wait for all three stage-5 jobs.
  # `!cancelled()` rather than success() so one failing grain still lets the
  # others consolidate, matching the standalone FINAL workflows.
  final_core:
    name: final - core
    needs: [plan, stage5_core, stage5_locations, stage5_rates]
    if: ${{ !cancelled() && needs.plan.outputs.run_final == 'true' }}
    uses: "./.github/workflows/(stage5)master_capacity_final_core.yml"
    secrets: inherit

  final_locations:
    name: final - locations
    needs: [plan, stage5_core, stage5_locations, stage5_rates]
    if: ${{ !cancelled() && needs.plan.outputs.run_final == 'true' }}
    uses: "./.github/workflows/(stage5)master_capacity_final_locations.yml"
    secrets: inherit

  final_rates:
    name: final - rates
    needs: [plan, stage5_core, stage5_locations, stage5_rates]
    if: ${{ !cancelled() && needs.plan.outputs.run_final == 'true' }}
    uses: "./.github/workflows/(stage5)master_capacity_final_rates.yml"
    secrets: inherit
