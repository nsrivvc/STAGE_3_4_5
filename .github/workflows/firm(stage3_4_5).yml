name: firm (stage 3-4-5)

# End-to-end run for the FIRM feed: stage 1-2 ingestion, then stage 3, 4, 5,
# then the three cross-feed FINAL tables.
#
# This is an orchestrator, not a copy. Each job calls the real per-stage
# workflow file as a reusable workflow, so there is exactly one definition of
# what each stage does. Editing a stage's own .yml changes it here too.
#
#   ingest (stage 1-2)  ->  stage3  ->  stage4  ->  stage5 core ------\
#                                                   stage5 locations   >-- finals
#                                                   stage5 rates -----/
#
# The ingestion code lives in this repo (stage 1 mock API in src/transformations/stage_1/,
# stage 2 loader in src/transformations/stage_2/), so the whole
# pipeline chains as plain jobs. The repository_dispatch trigger below is kept
# for backwards compatibility with anything that still posts
# bronze-firm-loaded from outside; a dispatch-triggered run also re-ingests
# first, which is idempotent.
#
# ABOUT THE FINAL TABLES
# ----------------------
# The FINAL tables always run at the end of this chain. They consolidate
# whatever feeds currently sit in Silver: after a firm-only run they contain
# firm's fresh rows plus whatever the other feeds last left behind, and once
# other feeds have landed they fold into the same master tables.
on:
  workflow_dispatch:
  # Called by shipper_scope_apply.yml and by all_sources(stage1-5).yml, so a
  # scope change or a multi-feed run replays this same chain rather than a
  # second copy of it.
  workflow_call:
  repository_dispatch:
    types: [bronze-firm-loaded]

# One end-to-end firm run at a time. The called workflows keep their own
# concurrency groups, which still apply per stage.
concurrency:
  group: firm-end-to-end
  cancel-in-progress: false

jobs:
  ingest:
    name: stage 1-2 - ingest to bronze
    uses: "./.github/workflows/bronze_ingest_firm.yml"
    secrets: inherit

  stage3:
    name: stage 3 - bronze to silver
    needs: ingest
    uses: "./.github/workflows/(stage3)bronze_to_silver_firm.yml"
    secrets: inherit

  stage4:
    name: stage 4 - rec-del pairing
    needs: stage3
    uses: "./.github/workflows/(stage4)rec_del_pairing_firm.yml"
    secrets: inherit

  stage5_core:
    name: stage 5 - firm core
    needs: stage4
    uses: "./.github/workflows/(stage5)master_capacity_firm_core.yml"
    secrets: inherit

  stage5_locations:
    name: stage 5 - firm locations
    needs: stage4
    uses: "./.github/workflows/(stage5)master_capacity_firm_locations.yml"
    secrets: inherit

  stage5_rates:
    name: stage 5 - firm rates
    needs: stage4
    uses: "./.github/workflows/(stage5)master_capacity_firm_rates.yml"
    secrets: inherit

  # The FINAL tables are cross-feed, so they wait for all three stage-5 jobs.

# THE FINAL TABLES ARE NOT RUN HERE. They are cross-feed: they consolidate
# whichever per-feed tables exist, so they only ever need to run ONCE, after
# every feed that is going to run has finished. Running them at the end of each
# feed's chain meant several feeds firing together collided on the
# stage5-final-* concurrency groups -- GitHub keeps one running plus one pending
# request per group, so a third arrival evicted the queued one and cancelled
# that feed's whole run ("Canceling since a higher priority waiting request for
# stage5-final-rates exists").
#
# Instead:
#   * a DIRECT run of this workflow (dashboard dispatch, repository_dispatch)
#     triggers finals(stage5).yml on completion, which coalesces so that several
#     feeds finishing together still consolidate exactly once;
#   * all_sources(stage1-5).yml and shipper_scope_apply.yml call this workflow
#     as a reusable workflow -- which emits NO workflow_run event -- and run the
#     finals themselves, once, after every selected feed.
#
# Either way the finals run once, after the feeds, and nothing gets evicted.
